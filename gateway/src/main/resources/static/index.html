<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Lab - dashboard</title>
  <style>
    :root { --bg:#fff; --fg:#1d1d1f; --muted:#6b7280; --card:#f6f7f9; --border:#d9dce1; --accent:#2563eb; --ok:#16a34a; --ko:#dc2626; }

    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 80rem; background: var(--bg); color: var(--fg); }
    input, select, button { font: inherit; }
    .bar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
    .bar input[type=text], .bar input[type=password] { width: 13rem; }
    .pill { padding: .1rem .6rem; border-radius: 1rem; font-size: .85rem; color: #fff; background: var(--ko); }
    .pill.on { background: var(--ok); }
    #global-error { color: var(--ko); min-height: 1.2rem; }

    #things { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 1rem; margin: 1rem 0 2rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: .6rem; padding: 1rem; transition: box-shadow .3s, border-color .3s; }
    .card.pulse { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
    .card.offline { opacity: .6; }
    .card h3 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
    .card h3 small { color: var(--muted); font-weight: normal; }
    .desc { color: var(--muted); font-size: .9rem; margin: .2rem 0 .8rem; }
    .card h4 { margin: .8rem 0 .3rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .25rem 0; }
    .row label { font-weight: 600; }
    .row .val { font-variant-numeric: tabular-nums; text-align: right; }
    .row input[type=number] { width: 5.5rem; }
    .row input[type=range] { width: 8rem; }

    /* toggle switch (enhanced checkbox) */
    .switch-wrap { display: inline-flex; align-items: center; gap: .5rem; }
    .switch-wrap .state { font-size: .85rem; color: var(--muted); min-width: 4.5rem; }
    .row label.switch { position: relative; display: inline-block; width: 2.9rem; height: 1.5rem; flex: none; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
    .switch .slider { position: absolute; inset: 0; background: var(--ko); border-radius: 1rem; transition: background .2s; }
    .switch .slider::before { content: ''; position: absolute; width: 1.1rem; height: 1.1rem; left: .2rem; top: .2rem; background: #fff; border-radius: 50%; transition: transform .2s; }
    .switch input:checked + .slider { background: var(--ok); }
    .switch input:checked + .slider::before { transform: translateX(1.4rem); }
    .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
    .switch input:disabled { cursor: wait; }
    .switch input:disabled + .slider { opacity: .55; }
    .action { display: flex; gap: .4rem; align-items: center; padding: .25rem 0; }
    .action input { width: 5.5rem; }
    .badge { display: none; margin-top: .6rem; padding: .2rem .5rem; border-radius: .4rem; background: var(--accent); color: #fff; font-size: .85rem; }
    .badge.show { display: inline-block; }
    .msg { min-height: 1.1rem; margin-top: .5rem; font-size: .85rem; color: var(--ko); }
    .foot { color: var(--muted); font-size: .8rem; }

    pre { background: var(--card); padding: .8rem; overflow: auto; max-height: 16rem; border-radius: .4rem; }
  </style>
</head>
<body>
<h1>Smart Lab - dashboard</h1>

<div class="bar">
  <span>Token: <input id="token" type="text" value="operator-secret"></span>
  <button id="btn-load">Load things</button>
  <button id="btn-connect">Connect to the event stream</button>
  <span id="status" class="pill">disconnected</span>
</div>
<div id="global-error"></div>

<h2>Things</h2>
<div id="things"><p class="foot">No thing registered.</p></div>

<h2>Live events (GET /events/stream)</h2>
<p><label><input type="checkbox" id="hide-ticks" checked> hide periodic measurement updates (thermostat temperature, meter consumption)</label></p>
<pre id="events"></pre>

  <script>
    const $ = id => document.getElementById(id);
    const token = () => $('token').value.trim();

    const READ_ONLY = new Set(['temperature', 'lastMotion', 'energyConsumed', 'instConsumption']);
    const ENUMS = { mode: ['off', 'heat', 'eco'] };
    const UNITS = { temperature: ' °C', target: ' °C', brightness: ' %', energyConsumed: ' kWs', instConsumption: ' kW' };
    const DECIMALS = { energyConsumed: 2, instConsumption: 2 };
    // boolean property driven by an action (shown as a toggle switch instead of a PUT checkbox)
    const SWITCH_ACTIONS = { live: 'toggle' };
    // display order of the properties (the REST model is an unordered map); unknown ones keep their order, after these
    const PROPERTY_ORDER = ['live', 'instConsumption', 'energyConsumed'];
    // periodic measurements, hidden from the event log when the checkbox is ticked
    const TICKS = { thermostat: ['temperature'], 'meter-circuit-breaker': ['instConsumption', 'energyConsumed'] };
    const ACTION_INPUTS = {
      setTarget:     { name: 'target',     min: 5, max: 30,  step: 0.5, value: 19 },
      setBrightness: { name: 'brightness', min: 0, max: 100, step: 1,   value: 100 },
    };

    // header sent with every request made from this dashboard (read it in the backend: req.get('X-Source'))
    const SOURCE_HEADERS = { 'X-Source': 'dashboard-manual' };

    const cards = new Map();
    async function api(method, path, body) {
      const headers = { Authorization: 'Bearer ' + token(), ...SOURCE_HEADERS };
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { /* not JSON */ }
      if (!res.ok) throw new Error((data && data.error) || res.status + ' ' + res.statusText);
      return data;
    }

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    let loading = null;
    function loadThings() {
      if (loading) return loading;
      loading = (async () => {
        try {
          const list = await api('GET', '/things');
          $('global-error').textContent = '';
          for (const id of [...cards.keys()]) {
            if (!list.some(t => t.id === id)) removeCard(id);
          }
          await Promise.allSettled(list.map(t => refreshThing(t.id)));
          renderEmpty();
        } catch (e) {
          $('global-error').textContent = 'GET /things failed: ' + e.message;
        } finally {
          loading = null;
        }
      })();
      return loading;
    }

    async function refreshThing(id) {
      const thing = await api('GET', '/things/' + encodeURIComponent(id));
      let card = cards.get(id);
      if (!card) card = createCard(thing);
      try {
        const props = await api('GET', '/things/' + encodeURIComponent(id) + '/properties');
        card.setOffline(false);
        for (const [name, value] of Object.entries(props)) card.set(name, value);
      } catch (e) {
        card.setOffline(true, e.message);
      }
    }


    function createCard(thing) {
      const model = thing.model || {};
      const widgets = {};
      const root = el('div', { className: 'card' });
      const msg = el('div', { className: 'msg' });
      const badge = el('div', { className: 'badge' });
      const foot = el('div', { className: 'foot' }, 'no event yet');

      root.append(
        el('h3', {}, thing.name || thing.id, el('small', {}, thing.id)),
        el('div', { className: 'desc' }, model.description || ''));

      // resolves to true on success, false on error (the message is displayed in the card)
      async function run(promise) {
        msg.textContent = '';
        try { await promise; return true; } catch (e) { msg.textContent = e.message; return false; }
      }

      const modelActions = model.actions || {};
      const rank = n => { const i = PROPERTY_ORDER.indexOf(n); return i < 0 ? PROPERTY_ORDER.length : i; };
      const props = Object.entries(model.properties || {}).sort((a, b) => rank(a[0]) - rank(b[0]));

      root.append(el('h4', {}, 'Properties'));
      for (const [name, def] of props) {
        const w = propertyWidget(thing.id, name, def, run, modelActions);
        widgets[name] = w;
        root.append(el('div', { className: 'row', title: def.description || '' },
          el('label', {}, name), w.node));
      }

      // actions (those already handled by a toggle switch get no extra button)
      const switched = new Set(Object.entries(SWITCH_ACTIONS)
        .filter(([prop, act]) => (model.properties || {})[prop] && modelActions[act])
        .map(([, act]) => act));
      const actions = Object.keys(modelActions).filter(a => !switched.has(a));
      if (actions.length) root.append(el('h4', {}, 'Actions'));
      for (const name of actions) {
        const spec = ACTION_INPUTS[name];
        const input = spec ? el('input', { type: 'number', min: spec.min, max: spec.max, step: spec.step, value: spec.value }) : null;
        const button = el('button', { textContent: name });
        button.onclick = () => run(api('POST',
          '/things/' + encodeURIComponent(thing.id) + '/actions/' + encodeURIComponent(name),
          spec ? { [spec.name]: Number(input.value) } : undefined));
        root.append(el('div', { className: 'action', title: (model.actions[name] || {}).description || '' },
          button, ...(input ? [input] : [])));
      }

      root.append(badge, msg, foot);
      $('things').append(root);

      let pulseTimer, badgeTimer;
      const card = {
        el: root,
        set(name, value) { if (widgets[name]) widgets[name].set(value); },
        pulse() {
          root.classList.add('pulse');
          clearTimeout(pulseTimer);
          pulseTimer = setTimeout(() => root.classList.remove('pulse'), 800);
        },
        badge(text) {
          badge.textContent = text;
          badge.classList.add('show');
          clearTimeout(badgeTimer);
          badgeTimer = setTimeout(() => badge.classList.remove('show'), 4000);
        },
        touch(ts) { foot.textContent = 'last event: ' + new Date(ts || Date.now()).toLocaleTimeString(); },
        setOffline(off, reason) {
          root.classList.toggle('offline', off);
          msg.textContent = off ? 'thing not reachable (' + reason + ')' : '';
        },
      };
      cards.set(thing.id, card);
      return card;
    }

    // a widget = { node, set(value) } ; set() never overwrites a field the user is typing in
    function propertyWidget(thingId, name, def, run, actions = {}) {
      const write = value => run(api('PUT',
        '/things/' + encodeURIComponent(thingId) + '/properties/' + encodeURIComponent(name), { value }));
      const unit = UNITS[name] || '';
      const readOnly = def.readOnly === true || READ_ONLY.has(name);

      // toggle switch bound to an action (e.g. circuit breaker: live <-> POST /actions/toggle)
      const switchAction = SWITCH_ACTIONS[name];
      if (def.type === 'boolean' && switchAction && actions[switchAction]) {
        const box = el('input', { type: 'checkbox', title: switchAction });
        const state = el('span', { className: 'state' }, '-');
        const show = v => {
          box.checked = v === true;
          state.textContent = v === true ? 'power on' : v === false ? 'power cut' : '-';
        };
        box.onchange = async () => {
          const wanted = box.checked;
          box.disabled = true;
          const ok = await run(api('POST',
            '/things/' + encodeURIComponent(thingId) + '/actions/' + encodeURIComponent(switchAction)));
          box.disabled = false;
          show(ok ? wanted : !wanted); // on error, go back to the previous state
        };
        return {
          node: el('span', { className: 'switch-wrap' },
            el('label', { className: 'switch' }, box, el('span', { className: 'slider' })), state),
          set: show,
        };
      }

      if (readOnly) {
        const out = el('span', { className: 'val' }, '-');
        return { node: out, set(v) { out.textContent = format(name, v, unit); } };
      }
      if (def.type === 'boolean') {
        const box = el('input', { type: 'checkbox' });
        box.onchange = () => write(box.checked);
        return { node: box, set(v) { box.checked = v === true; } };
      }
      if (ENUMS[name]) {
        const select = el('select', {}, ...ENUMS[name].map(o => el('option', { value: o, textContent: o })));
        select.onchange = () => write(select.value);
        return { node: select, set(v) { if (document.activeElement !== select) select.value = v; } };
      }
      if (def.type === 'integer' && name === 'brightness') {
        const range = el('input', { type: 'range', min: 0, max: 100, step: 1 });
        const out = el('span', { className: 'val' }, '-');
        range.oninput = () => { out.textContent = range.value + unit; };
        range.onchange = () => write(Number(range.value));
        return {
          node: el('span', {}, range, ' ', out),
          set(v) {
            out.textContent = v + unit;
            if (document.activeElement !== range) range.value = v;
          },
        };
      }
      if (def.type === 'float' || def.type === 'integer') {
        const num = el('input', { type: 'number', step: def.type === 'float' ? 0.5 : 1 });
        num.onchange = () => write(Number(num.value));
        return { node: el('span', {}, num, unit), set(v) { if (document.activeElement !== num) num.value = v; } };
      }
      const out = el('span', { className: 'val' }, '-');
      return { node: out, set(v) { out.textContent = format(name, v, unit); } };
    }

    function format(name, v, unit) {
      if (v === null || v === undefined) return 'none yet';
      if (name === 'lastMotion') return new Date(v).toLocaleTimeString();
      if (typeof v === 'number') {
        if (DECIMALS[name] !== undefined) return v.toFixed(DECIMALS[name]) + unit;
        return (Number.isInteger(v) ? v : v.toFixed(1)) + unit;
      }
      return String(v);
    }

    function removeCard(id) {
      const card = cards.get(id);
      if (card) { card.el.remove(); cards.delete(id); }
      renderEmpty();
    }

    function renderEmpty() {
      const box = $('things');
      const placeholder = box.querySelector('p.foot');
      if (cards.size === 0 && !placeholder) box.append(el('p', { className: 'foot' }, 'No thing registered.'));
      if (cards.size > 0 && placeholder) placeholder.remove();
    }

    // ---- real time: EventSource cannot send headers, token in the query string ----
    let source;
    function connect() {
      if (source) source.close();
      source = new EventSource('/events/stream?token=' + encodeURIComponent(token()));

      // 'hello' is sent at every (re)connection: resynchronise the cards
      source.addEventListener('hello', e => { setStatus(true); log('hello', e.data); loadThings(); });

      source.addEventListener('registry', e => {
        log('registry', e.data);
        const ev = JSON.parse(e.data);
        if (ev.type === 'registered') refreshThing(ev.thingId).catch(err => showError(err));
        if (ev.type === 'unregistered') removeCard(ev.thingId);
      });

      source.addEventListener('thing', e => {
        const ev = JSON.parse(e.data); // { thingId, type, data, timestamp }
        const tick = ev.type === 'propertyChanged' && (TICKS[ev.thingId] || []).includes(ev.data.property);
        if (!(tick && $('hide-ticks').checked)) log('thing', e.data);
        const card = cards.get(ev.thingId);
        if (!card) return;
        card.touch(ev.timestamp);
        if (ev.type === 'propertyChanged') {
          card.set(ev.data.property, ev.data.value);
        } else if (ev.type === 'motion') {
          card.set('lastMotion', ev.data.lastMotion);
          card.pulse();
          card.badge('motion detected');
        } else if (ev.type === 'targetReached') {
          card.pulse();
          card.badge('target reached (' + ev.data.target + ' °C)');
        } else if (ev.type === 'breakerToggled') {
          // payload not specified by the model: accept { live } or { value }, otherwise just notify
          const d = ev.data || {};
          const live = typeof d.live === 'boolean' ? d.live : typeof d.value === 'boolean' ? d.value : undefined;
          if (live !== undefined) card.set('live', live);
          card.pulse();
          card.badge(live === undefined ? 'breaker toggled' : live ? 'power restored' : 'power cut off');
        }
      });

      // EventSource retries by itself, except after a 401 (readyState CLOSED)
      source.onerror = () => {
        setStatus(false);
        log('error', 'stream closed (wrong token or gateway stopped?)');
      };
    }

    function setStatus(connected) {
      const s = $('status');
      s.textContent = connected ? 'live' : 'disconnected';
      s.classList.toggle('on', connected);
    }

    function showError(e) { $('global-error').textContent = e.message; }

    function log(name, data) {
      const pre = $('events');
      pre.textContent = new Date().toLocaleTimeString() + ' [' + name + '] ' + data + '\n' + pre.textContent;
      if (pre.textContent.length > 20000) pre.textContent = pre.textContent.slice(0, 20000);
    }

    $('btn-load').onclick = loadThings;
    $('btn-connect').onclick = () => { connect(); loadThings(); };
    connect();
    loadThings();
  </script>
</body>
</html>
